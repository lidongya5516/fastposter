<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fastposter 海报生成</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #f0f2f5;
  color: #333;
  min-height: 100vh;
}

/* Header */
.header {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
  padding: 20px 0;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.header h1 { font-size: 28px; font-weight: 600; letter-spacing: 1px; }
.header p { margin-top: 6px; font-size: 14px; opacity: 0.85; }
.header .token-bar {
  margin-top: 12px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
}
.header .token-bar input {
  padding: 6px 12px;
  border: none;
  border-radius: 4px;
  width: 280px;
  font-size: 13px;
  outline: none;
}
.header .token-bar button {
  padding: 6px 16px;
  border: none;
  border-radius: 4px;
  background: rgba(255,255,255,0.25);
  color: #fff;
  cursor: pointer;
  font-size: 13px;
  transition: background 0.2s;
}
.header .token-bar button:hover { background: rgba(255,255,255,0.4); }

/* Main layout */
.container { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }

/* Steps indicator */
.steps {
  display: flex;
  justify-content: center;
  gap: 48px;
  margin-bottom: 28px;
}
.step {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #999;
  font-size: 14px;
}
.step.active { color: #667eea; font-weight: 600; }
.step.done { color: #52c41a; }
.step-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: #e8e8e8;
  font-size: 13px;
  font-weight: 600;
}
.step.active .step-num { background: #667eea; color: #fff; }
.step.done .step-num { background: #52c41a; color: #fff; }

/* Template grid */
.section-title {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 16px;
  color: #444;
}
.template-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 20px;
  margin-bottom: 32px;
}
.template-card {
  background: #fff;
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  transition: transform 0.2s, box-shadow 0.2s;
  border: 2px solid transparent;
}
.template-card:hover { transform: translateY(-4px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
.template-card.selected { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.2); }
.template-card img {
  width: 100%;
  aspect-ratio: 1680/1185;
  object-fit: cover;
  display: block;
}
.template-card .info { padding: 12px 14px; }
.template-card .info h3 { font-size: 14px; font-weight: 500; color: #333; }
.template-card .info p { font-size: 12px; color: #999; margin-top: 4px; }

/* Form panel */
.form-panel {
  background: #fff;
  border-radius: 10px;
  padding: 28px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  margin-bottom: 32px;
  display: none;
}
.form-panel.visible { display: block; }
.form-panel h2 { font-size: 18px; font-weight: 600; margin-bottom: 20px; }
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: #555;
  margin-bottom: 6px;
}
.form-group label .vd-tag {
  display: inline-block;
  font-size: 11px;
  background: #f0f2ff;
  color: #667eea;
  padding: 0 6px;
  border-radius: 3px;
  margin-left: 6px;
}
.form-group input, .form-group textarea {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid #d9d9d9;
  border-radius: 6px;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
.form-group input:focus, .form-group textarea:focus { border-color: #667eea; box-shadow: 0 0 0 2px rgba(102,126,234,0.15); }
.form-group textarea { min-height: 60px; resize: vertical; }

/* Action buttons */
.actions {
  display: flex;
  gap: 12px;
  margin-top: 24px;
}
.btn {
  padding: 10px 28px;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-primary { background: #667eea; color: #fff; }
.btn-primary:hover { background: #5a6fd6; }
.btn-primary:disabled { background: #a8b4f0; cursor: not-allowed; }
.btn-default { background: #f5f5f5; color: #555; }
.btn-default:hover { background: #e8e8e8; }
.btn-success { background: #52c41a; color: #fff; }
.btn-success:hover { background: #45a818; }

/* Result */
.result-panel {
  background: #fff;
  border-radius: 10px;
  padding: 28px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  display: none;
}
.result-panel.visible { display: block; }
.result-panel h2 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
.result-panel img {
  max-width: 100%;
  max-height: 600px;
  border-radius: 8px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.1);
  display: block;
  margin: 0 auto;
}
.result-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-top: 16px;
}

/* Loading */
.loading {
  text-align: center;
  padding: 60px 20px;
  color: #999;
}
.spinner {
  display: inline-block;
  width: 36px; height: 36px;
  border: 3px solid #e8e8e8;
  border-top-color: #667eea;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Empty */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: #bbb;
  font-size: 15px;
}

/* Error */
.error-msg {
  background: #fff2f0;
  border: 1px solid #ffccc7;
  color: #ff4d4f;
  padding: 10px 16px;
  border-radius: 6px;
  font-size: 13px;
  margin-bottom: 16px;
  display: none;
}
.error-msg.visible { display: block; }

/* Responsive */
@media (max-width: 640px) {
  .steps { gap: 16px; font-size: 12px; }
  .header .token-bar input { width: 160px; }
  .template-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .form-panel, .result-panel { padding: 16px; }
}
</style>
</head>
<body>

<div class="header">
  <h1>fastposter 海报生成</h1>
  <p>选择模板 → 填写内容 → 生成海报</p>
  <div class="token-bar">
    <input id="tokenInput" type="text" placeholder="请输入 API Token（或先在后台登录）" />
    <button onclick="loadTemplates()">加载模板</button>
    <button onclick="document.getElementById('tokenInput').value=localStorage.getItem('fptoken')||''; loadTemplates()" style="background:rgba(255,255,255,0.15)" title="使用后台登录Token">使用已登录 Token</button>
  </div>
</div>

<div class="container">

  <!-- Steps -->
  <div class="steps">
    <div class="step active" id="step1"><span class="step-num">1</span> 选择模板</div>
    <div class="step" id="step2"><span class="step-num">2</span> 填写内容</div>
    <div class="step" id="step3"><span class="step-num">3</span> 生成海报</div>
  </div>

  <!-- Error -->
  <div class="error-msg" id="errorMsg"></div>

  <!-- Templates -->
  <div id="templateSection">
    <div class="section-title">可选模板</div>
    <div class="template-grid" id="templateGrid"></div>
  </div>

  <!-- Form -->
  <div class="form-panel" id="formPanel">
    <h2 id="formTitle">填写内容</h2>
    <div id="formFields"></div>
    <div class="actions">
      <button class="btn btn-primary" onclick="generatePoster()" id="generateBtn">生成海报</button>
      <button class="btn btn-default" onclick="resetAll()">重新选择</button>
    </div>
  </div>

  <!-- Result -->
  <div class="result-panel" id="resultPanel">
    <h2>生成结果</h2>
    <img id="resultImage" alt="生成的海报" />
    <div class="result-actions">
      <button class="btn btn-primary" onclick="downloadPoster()">下载海报</button>
      <button class="btn btn-default" onclick="resetAll()">重新制作</button>
    </div>
  </div>

</div>

<script>
let currentPosters = [];
let selectedPoster = null;
let formValues = {};
let lastBlobUrl = null;

const API_BASE = (window.API_URL || '/').replace(/\/+$/, '');

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('visible');
}
function hideError() {
  document.getElementById('errorMsg').classList.remove('visible');
}

function setStep(n) {
  for (let i = 1; i <= 3; i++) {
    const el = document.getElementById('step' + i);
    el.classList.remove('active', 'done');
    if (i < n) el.classList.add('done');
    else if (i === n) el.classList.add('active');
  }
}

// Load posters
async function loadTemplates() {
  hideError();
  const token = document.getElementById('tokenInput').value.trim();
  if (!token) { showError('请输入 Token'); return; }
  const grid = document.getElementById('templateGrid');
  grid.innerHTML = '<div class="loading"><div class="spinner"></div>加载模板中...</div>';

  try {
    const res = await fetch(API_BASE + '/api/user/posters', {
      headers: { 'token': token }
    });
    const data = await res.json();
    if (data.code !== 0) { showError(data.msg || '加载失败'); grid.innerHTML = ''; return; }
    currentPosters = data.data.posters || [];
    renderTemplates(currentPosters);
  } catch (e) {
    grid.innerHTML = '';
    showError('网络错误：' + e.message);
  }
}

function renderTemplates(posters) {
  const grid = document.getElementById('templateGrid');
  if (posters.length === 0) {
    grid.innerHTML = '<div class="empty">暂无模板，请先在管理后台创建海报</div>';
    return;
  }
  const baseUrl = API_BASE;
  grid.innerHTML = posters.map(p => {
    const previewUrl = p.preview && (p.preview.startsWith('http') ? p.preview : baseUrl + '/' + p.preview);
    const varCount = countVariables(p.json);
    return `<div class="template-card" data-id="${p.id}" onclick="selectTemplate(${p.id})">
      <img src="${previewUrl || ''}" alt="${p.name}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22140%22><rect fill=%22%23f5f5f5%22 width=%22200%22 height=%22140%22/><text x=%22100%22 y=%2270%22 text-anchor=%22middle%22 fill=%22%23ccc%22 font-size=%2214%22>无预览</text></svg>'">
      <div class="info"><h3>${p.name}</h3><p>${varCount} 个可填字段</p></div>
    </div>`;
  }).join('');
}

function countVariables(jsonStr) {
  try {
    const d = JSON.parse(jsonStr);
    return (d.items || []).filter(i => i.vd && i.vd.trim()).length;
  } catch(e) { return 0; }
}

// Select template
async function selectTemplate(id) {
  hideError();
  const token = document.getElementById('tokenInput').value.trim();
  // highlight
  document.querySelectorAll('.template-card').forEach(c => c.classList.remove('selected'));
  const card = document.querySelector(`.template-card[data-id="${id}"]`);
  if (card) card.classList.add('selected');

  // fetch full poster data
  try {
    const res = await fetch(API_BASE + '/api/user/poster/' + id, {
      headers: { 'token': token }
    });
    const data = await res.json();
    if (data.code !== 0) { showError(data.msg || '获取模板失败'); return; }
    selectedPoster = data.data.poster;
    buildForm(selectedPoster);
  } catch(e) {
    showError('网络错误：' + e.message);
  }
}

function buildForm(poster) {
  const panel = document.getElementById('formPanel');
  const fields = document.getElementById('formFields');
  const title = document.getElementById('formTitle');

  let json;
  try { json = JSON.parse(poster.json); } catch(e) { showError('模板数据异常'); return; }

  title.textContent = '填写内容 — ' + poster.name;
  formValues = {};

  const items = json.items || [];
  const vdItems = items.filter(i => i.vd && i.vd.trim());

  if (vdItems.length === 0) {
    fields.innerHTML = '<p style="color:#999;padding:20px 0">该模板没有可填字段，直接生成即可。</p>';
  } else {
    fields.innerHTML = vdItems.map(i => {
      const label = i.vd;
      const placeholder = i.v || '';
      const isLong = placeholder.length > 30;
      formValues[label] = placeholder;
      return `<div class="form-group">
        <label>${label} <span class="vd-tag">{{${label}}}</span></label>
        ${isLong
          ? `<textarea id="fld-${label}" placeholder="${placeholder}" oninput="formValues['${label}']=this.value">${placeholder}</textarea>`
          : `<input id="fld-${label}" type="text" placeholder="${placeholder}" value="${placeholder}" oninput="formValues['${label}']=this.value" />`
        }
      </div>`;
    }).join('');
  }

  panel.classList.add('visible');
  document.getElementById('resultPanel').classList.remove('visible');
  setStep(2);
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Generate poster
async function generatePoster() {
  hideError();
  const token = document.getElementById('tokenInput').value.trim();
  if (!selectedPoster) { showError('请先选择模板'); return; }

  const btn = document.getElementById('generateBtn');
  btn.disabled = true;
  btn.textContent = '生成中...';

  try {
    // Build payload from form values, only include non-empty values
    const payload = {};
    Object.keys(formValues).forEach(k => {
      if (formValues[k] && formValues[k].trim()) {
        payload[k] = formValues[k].trim();
      }
    });

    const res = await fetch(API_BASE + '/v1/build/poster', {
      method: 'POST',
      headers: {
        'token': token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        uuid: selectedPoster.code,
        payload: JSON.stringify(payload)
      })
    });

    if (!res.ok) {
      const text = await res.text();
      try {
        const err = JSON.parse(text);
        showError(err.msg || '生成失败');
      } catch(e) {
        showError('生成失败 (HTTP ' + res.status + ')');
      }
      btn.disabled = false;
      btn.textContent = '生成海报';
      return;
    }

    // Display result
    const blob = await res.blob();
    if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
    lastBlobUrl = URL.createObjectURL(blob);

    const resultPanel = document.getElementById('resultPanel');
    const resultImg = document.getElementById('resultImage');
    resultImg.src = lastBlobUrl;
    resultPanel.classList.add('visible');
    setStep(3);
    resultPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });

  } catch(e) {
    showError('网络错误：' + e.message);
  }

  btn.disabled = false;
  btn.textContent = '生成海报';
}

function downloadPoster() {
  const img = document.getElementById('resultImage');
  if (!img.src) return;
  const a = document.createElement('a');
  a.href = img.src;
  const ext = selectedPoster ? (() => {
    try { return JSON.parse(selectedPoster.json).type || 'png'; } catch(e) { return 'png'; }
  })() : 'png';
  a.download = (selectedPoster ? selectedPoster.name : 'poster') + '.' + ext;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function resetAll() {
  selectedPoster = null;
  formValues = {};
  document.getElementById('formPanel').classList.remove('visible');
  document.getElementById('resultPanel').classList.remove('visible');
  document.querySelectorAll('.template-card').forEach(c => c.classList.remove('selected'));
  setStep(1);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Auto-load when token exists
(function() {
  const saved = localStorage.getItem('fptoken');
  if (saved) {
    document.getElementById('tokenInput').value = saved;
    loadTemplates();
  }
})();
</script>
</body>
</html>
